    <!-- Scripting for specific article -->
    <script>
        const btnHamburger = document.getElementById('btnHamburger');
        const detailsNav = document.getElementById('detailsNav');
        
        btnHamburger.addEventListener('click', () => {
            btnHamburger.classList.toggle('active');
            detailsNav.classList.toggle('open');
            playLocalClick();
        });

        /* Local click sound */
        let localCtx = null;
        function playLocalClick() {
            try {
                if (!localCtx) {
                    localCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (localCtx.state === 'suspended') localCtx.resume();
                const now = localCtx.currentTime;
                const bufferSize = localCtx.sampleRate * 0.01;
                const buffer = localCtx.createBuffer(1, bufferSize, localCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = localCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = localCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(5500, now);
                filter.Q.setValueAtTime(4, now);
                
                const gain = localCtx.createGain();
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.008);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(localCtx.destination);
                
                const osc = localCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                const oscGain = localCtx.createGain();
                oscGain.gain.setValueAtTime(0.04, now);
                oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
                
                osc.connect(oscGain);
                oscGain.connect(localCtx.destination);
                
                noise.start(now);
                osc.start(now);
                osc.stop(now + 0.08);
            } catch(e) {}
        }

        // Apply Custom Accent Theme color dynamically
        function loadSavedTheme() {
            const savedColor = localStorage.getItem('portfolio-custom-color');
            if (savedColor) {
                document.documentElement.style.setProperty('--accent-color', savedColor);
                let hex = savedColor.replace('#', '');
                if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                document.documentElement.style.setProperty('--accent-color-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--accent-glow', `0 0 12px rgba(${r}, ${g}, ${b}, 0.7), 0 0 30px rgba(${r}, ${g}, ${b}, 0.3)`);
            }
        }
        loadSavedTheme();


    </script>
