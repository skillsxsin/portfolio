    <!-- Scripting for Projects logic -->
    <script>
        const btnHamburger = document.getElementById('btnHamburger');
        const detailsNav = document.getElementById('detailsNav');
        const projectsContainer = document.getElementById('projectsListContainer');
        const filterBar = document.getElementById('filterBar');
        const searchInput = document.getElementById('projectSearchInput');
        const sortSelect = document.getElementById('projectSortSelect');
        let allProjects = [];
        let activeCategory = 'all';

        btnHamburger.addEventListener('click', () => {
            btnHamburger.classList.toggle('active');
            detailsNav.classList.toggle('open');
            playLocalClick();
        });

        // Search input live filtering
        searchInput.addEventListener('input', () => {
            renderProjects(activeCategory);
        });

        function handleSortChange() {
            playLocalClick();
            renderProjects(activeCategory);
        }

        // Fetch projects from db.json API
        async function fetchProjects() {
            try {
                const response = await fetch('/api/projects');
                if (!response.ok) throw new Error("API response error");
                allProjects = await response.json();
                
                updateStructuredData(allProjects);
                setupFilterButtons();
                renderProjects('all');
            } catch (err) {
                projectsContainer.innerHTML = `<p class="details-text" style="color: #ff5f56; text-align: center;">Error loading projects database: ${err.message}</p>`;
            }
        }

        function setupFilterButtons() {
            const filterBtns = filterBar.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeCategory = btn.getAttribute('data-filter');
                    renderProjects(activeCategory);
                    playLocalClick();
                });
            });
        }

        // Render project cards with search, category filter, and sorting
        function renderProjects(filter = 'all') {
            activeCategory = filter;
            const query = (searchInput.value || '').trim().toLowerCase();
            const sortMode = sortSelect.value;

            let filtered = filter === 'all' 
                ? [...allProjects] 
                : allProjects.filter(p => p.category === filter);

            if (query) {
                filtered = filtered.filter(p => 
                    p.title.toLowerCase().includes(query) ||
                    p.description.toLowerCase().includes(query) ||
                    (p.tags && p.tags.some(t => t.toLowerCase().includes(query)))
                );
            }

            if (sortMode === 'alpha-asc') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (sortMode === 'alpha-desc') {
                filtered.sort((a, b) => b.title.localeCompare(a.title));
            }
            // 'recent' retains the natural db.json order (which has recent projects first)

            if (filtered.length === 0) {
                projectsContainer.innerHTML = `<p class="details-text" style="text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 2rem 0;">No projects match your search criteria.</p>`;
                return;
            }

            projectsContainer.innerHTML = filtered.map(p => {
                const hasLive = p.links && p.links.live && p.links.live !== '#' && p.links.live !== '';
                const hasGithub = p.links && p.links.github && p.links.github !== '#' && p.links.github !== '';
                const actionButtonsHtml = (hasLive || hasGithub) ? `
                    <div class="project-card-actions">
                        ${hasLive ? `<a href="${p.links.live}" class="project-link-btn" onclick="playLocalClick();">Live Demo ➔</a>` : ''}
                        ${hasGithub ? `<a href="${p.links.github}" target="_blank" rel="noopener noreferrer" class="project-link-btn text" onclick="playLocalClick();">GitHub 📁</a>` : ''}
                    </div>
                ` : '';

                return `
                <div class="details-project-card">
                    <div class="project-card-header">
                        <h3 class="project-card-title">${p.title}</h3>
                        <span class="project-tag-badge">${p.category}</span>
                    </div>
                    <p class="details-project-tech">Stack: ${p.tags.join(' • ')}</p>
                    <p class="details-text" style="font-size: 0.88rem; line-height: 1.6;">${p.description}</p>
                    ${actionButtonsHtml}
                </div>
                `;
            }).join('');
        }

        // Dynamic schema updates for search engines
        function updateStructuredData(projects) {
            const schemaScript = document.getElementById('structured-data-projects');
            if (!schemaScript) return;
            
            const itemList = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "name": "Bhavya Jangid's Engineering Projects",
                "description": "Index catalog of technical projects built by Bhavya Jangid",
                "itemListElement": projects.map((p, index) => ({
                    "@type": "ListItem",
                    "position": index + 1,
                    "item": {
                        "@type": "CreativeWork",
                        "name": p.title,
                        "description": p.description,
                        "keywords": p.tags.join(', '),
                        "genre": p.category,
                        "url": "https://bhavyajangid.com/projects"
                    }
                }))
            };
            
            schemaScript.textContent = JSON.stringify(itemList);
        }

        /* Local click sound */
        let localCtx = null;
        function playLocalClick() {
            try {
                if (!localCtx) {
                    localCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (localCtx.state === 'suspended') localCtx.resume();
                const now = localCtx.currentTime;
                const bufferSize = localCtx.sampleRate * 0.01;
                const buffer = localCtx.createBuffer(1, bufferSize, localCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = localCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = localCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(5500, now);
                filter.Q.setValueAtTime(4, now);
                
                const gain = localCtx.createGain();
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.008);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(localCtx.destination);
                
                const osc = localCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                const oscGain = localCtx.createGain();
                oscGain.gain.setValueAtTime(0.04, now);
                oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
                
                osc.connect(oscGain);
                oscGain.connect(localCtx.destination);
                
                noise.start(now);
                osc.start(now);
                osc.stop(now + 0.08);
            } catch(e) {}
        }

        // Apply visual theme color dynamically from localStorage
        function loadSavedTheme() {
            const savedColor = localStorage.getItem('portfolio-custom-color');
            if (savedColor) {
                document.documentElement.style.setProperty('--accent-color', savedColor);
                let hex = savedColor.replace('#', '');
                if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                document.documentElement.style.setProperty('--accent-color-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--accent-glow', `0 0 12px rgba(${r}, ${g}, ${b}, 0.7), 0 0 30px rgba(${r}, ${g}, ${b}, 0.3)`);
            }
        }
        loadSavedTheme();
        fetchProjects();


    </script>
